[package]
name = "oober"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "High-performance regex pattern scanning and replacement CLI with backups and undo"

[dependencies]
ignore = "0.4"
regex = { version = "1.9", features = ["perf-dfa", "perf-literal"] }  # SIMD-powered regex engine with performance features
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
serde_json = "1.0"
clap = { version = "4.5.38", features = ["derive", "env"] }
rayon = "1.8"                                                  # Parallel processing
chrono = { version = "0.4", features = ["serde"] }            # For scan report timestamps
tempfile = "3.8"                                               # For safe file writing
thiserror = "1.0"                                              # Error handling derive macro
num_cpus = "1.16"                                              # CPU count detection
sha2 = "0.10"                                                  # File fingerprinting
dirs = "5.0"                                                   # XDG directories
csv = "1.3"                                                    # CSV output format

[dev-dependencies]
assert_cmd = "2.0"                                             # End-to-end CLI testing
predicates = "3.0"                                             # Assertions on CLI output

[profile.release]
lto = true
codegen-units = 1
strip = true
